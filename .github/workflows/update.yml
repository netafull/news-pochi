name: update

on:
  # 定期実行はGitHubのscheduleを使わず、Google Cloud Schedulerからworkflow_dispatch APIを
  # 1時間ごとに叩く前提にする(scheduleもpushトリガーも付けない)。理由: GitHub側のschedule
  # は公称間隔に対し最長12時間超の欠測が実測されており、workflow_dispatchはその間引きの
  # 対象外のため(姉妹のポチサイトと同じ方針)。
  #
  # 発火元: Cloud Schedulerのジョブ(運営者の確認後に作成する予定。名前は news-pochi-update、
  #   毎時0分を想定)。手動実行: gh workflow run update.yml -R netafull/news-pochi
  workflow_dispatch:
  # ブログの登録・解除（data/blogs.json の編集）が main に入ったら、定期実行を待たずにすぐ反映する。
  # 取得するのは登録ブログのフィード数本だけで、外部APIの枠は使わない。
  # ボットのコミットは docs/ だけを変えるので、ここに引っかかってループすることはない
  push:
    branches: [main]
    paths:
      - data/blogs.json

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # ubuntu-latest は2026-10-19からUbuntu 26に切り替わる(GitHubの予告)。Pythonなどの
    # 実行環境が変わって動かなくなるのを避けるため、現在のUbuntu 24.04に固定している。
    # 切り替えるときは動作を確認してから変えること
    runs-on: ubuntu-24.04
    # 6ブログ・9フィード、リクエスト間隔2秒(robots.txtの確認を含めても1分前後)。余裕を持たせる
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: ブログ設定の確認
        run: python3 scripts/check_blogs.py

      - name: テスト
        run: python3 -m unittest discover -s tests

      - name: フィードを取得
        run: python3 scripts/fetch_feeds.py

      - name: サイトを生成
        run: python3 build.py

      - name: コミットしてプッシュ
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi
          git add -A
          # コンフリクトマーカーが混入したままコミットされる事故が既存サイトで
          # 起きているため、push前に必ず確認する
          if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/ docs/; then
            echo "::error::コンフリクトマーカーを検出したため中止します"
            exit 1
          fi
          git commit -m "記事を更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          # 衝突しうるのは docs/ の生成物だけ。-X theirs は rebase 中は「自分のコミット側」を
          # 優先する指定。取り込んだあとサイトを再生成して、生成物をデータと必ず一致させる
          git pull --rebase -X theirs origin main
          python3 build.py
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "サイトを再生成 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          fi
          git push origin HEAD:main
