name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: ブログ設定の確認
        run: python3 scripts/check_blogs.py

      # JSのテストは macOS の osascript(JXA) を使うため、Linuxではスキップされる
      - name: テスト
        run: python3 -m unittest discover -s tests
